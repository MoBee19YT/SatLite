<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High-Performance Satellite Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.4/satellite.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: monospace; overflow: hidden; }
        #map { width: 100vw; height: 100vh; background: #000; transition: transform 0.3s ease; }
        
        #status { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 1000; 
            background: rgba(0,0,0,0.8); 
            padding: 10px 20px; 
            border: 1px solid #00ffff; 
            color: #00ffff; 
            border-radius: 8px; 
            font-size: 13px; 
            pointer-events: none; 
        }

        #controls { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            z-index: 1000; 
            background: rgba(0,0,0,0.85); 
            padding: 15px; 
            border: 1px solid #00ffff; 
            border-radius: 8px; 
            font-size: 12px; 
            max-height: 85vh; 
            overflow-y: auto; 
            width: 260px; 
            box-sizing: border-box;
        }

        #controls label { display: block; margin-bottom: 8px; cursor: pointer; }
        #controls input[type="checkbox"] { cursor: pointer; margin-right: 8px; }
        
        #search-box { width: 100%; box-sizing: border-box; background: #111; border: 1px solid #00ffff; color: #fff; padding: 6px; font-family: monospace; border-radius: 4px; margin-bottom: 6px; }
        #search-hint { font-size: 10px; color: #888; margin-bottom: 8px; display: block; }
        
        .action-btn { width: 100%; background: #00ffff; color: #000; border: none; padding: 6px; font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 12px; }
        .action-btn:hover { background: #00cccc; }
        .section-divider { border-top: 1px dashed #00ffff; margin: 12px 0; padding-top: 8px; }

        #mobile-menu-toggle { display: none; }

        /* Modal Styles */
        #notif-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: #111; border: 1px solid #00ffff; padding: 20px; border-radius: 8px; width: 320px; color: #fff; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
        .modal-content h3 { color: #00ffff; margin-top: 0; }
        .modal-content label { display: block; margin-bottom: 6px; cursor: pointer; font-size: 11px; }
        .modal-content button { width: 100%; background: #00ffff; color: #000; border: none; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: monospace; margin-top: 5px; }
        .close-modal { background: #ff0055 !important; color: #fff !important; }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            #status { top: 10px; left: 10px; right: 10px; font-size: 11px; text-align: center; }
            #mobile-menu-toggle { display: block; position: fixed; bottom: 20px; right: 20px; z-index: 2000; width: 55px; height: 55px; border-radius: 50%; background: #00ffff; color: #000; border: none; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,255,255,0.4); }
            
            #controls { 
                top: auto; 
                bottom: -100%; 
                right: 0; 
                left: 0; 
                width: 100%; 
                max-height: 55vh; 
                border-radius: 12px 12px 0 0; 
                transition: bottom 0.3s ease-in-out; 
                padding: 20px; 
            }
            #controls.mobile-open { 
                bottom: 0; 
            }
            body.menu-shifted #map { 
                transform: translateY(-160px); 
            }
        }
    </style>
</head>
<body>

    <div id="status">INITIALIZING TRACKER...</div>
    
    <button id="mobile-menu-toggle">⚙️</button>

    <!-- Notification Setup Modal Popup -->
    <div id="notif-modal">
        <div class="modal-content">
            <h3>PASS NOTIFICATION SETUP</h3>
            <p style="font-size: 11px; color: #aaa;">Select categories & conditions for overhead alerts (100km radius):</p>
            
            <b>Target Categories:</b>
            <label><input type="checkbox" id="modal-cat-stations" checked> Space Stations (incl. ISS)</label>
            <label><input type="checkbox" id="modal-cat-visual"> Brightest / Visual</label>
            <label><input type="checkbox" id="modal-cat-starlink"> Starlink</label>
            <label><input type="checkbox" id="modal-cat-weather"> Weather & Earth</label>
            <label><input type="checkbox" id="modal-cat-active"> All Active Satellites</label>

            <div class="section-divider"></div>

            <b>Time Conditions:</b>
            <label><input type="checkbox" id="modal-time-day" checked> Day Passes</label>
            <label><input type="checkbox" id="modal-time-night" checked> Night Passes</label>

            <button id="save-modal-btn">SET NOTIFICATIONS</button>
            <button class="action-btn close-modal" id="close-modal-btn">CLOSE</button>
        </div>
    </div>

    <div id="controls">
        <b>ALERTS:</b><br><br>
        <button id="open-notif-modal" class="action-btn">⚙️ NOTIFICATION SETTINGS</button>

        <div class="section-divider"></div>

        <b>SEARCH SATELLITE:</b><br><br>
        <input type="text" id="search-box" placeholder="Name or NORAD ID">
        <span id="search-hint">Search by Name or NORAD</span>
        <button id="search-btn" class="action-btn">FIND SATELLITE</button>

        <div class="section-divider"></div>

        <b>CATEGORIES:</b><br><br>
        <label><input type="checkbox" value="stations" class="cat-box"> Space Stations</label>
        <label><input type="checkbox" value="visual" class="cat-box"> Brightest / Visual</label>
        <label><input type="checkbox" value="starlink" class="cat-box"> Starlink</label>
        <label><input type="checkbox" value="weather" class="cat-box"> Weather & Earth</label>
        <label><input type="checkbox" value="active" class="cat-box" checked style="border-top: 1px dashed #00ffff; padding-top: 8px;"> 🌐 All Active Satellites</label>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const canvasRenderer = L.canvas({ padding: 0.5 });

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + (days*24*60*60*1000));
            document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
        }

        const map = L.map('map', { 
            attributionControl: false,
            worldCopyJump: true,
            maxBounds: [[-90, -Infinity], [90, Infinity]],
            maxBoundsViscosity: 1.0,
            renderer: canvasRenderer
        }).setView([0, 0], 2);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 18,
            minZoom: 2,
            noWrap: false,
            renderer: canvasRenderer
        }).addTo(map);

        const statusDiv = document.getElementById('status');
        
        let allTrackers = [];
        let nameToTracker = new Map();
        let selectedTracker = null;
        let orbitLayers = [];
        let trajectoryEndTime = 0;
        let userMarker = null;

        let userLat = null;
        let userLng = null;

        const savedLoc = getCookie('auto_user_loc');
        if (savedLoc) {
            const coords = savedLoc.split(',');
            userLat = parseFloat(coords[0]);
            userLng = parseFloat(coords[1]);
            placeUserMarker(userLat, userLng);
        } else if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                setCookie('auto_user_loc', `${userLat},${userLng}`, 30);
                placeUserMarker(userLat, userLng);
            }, () => {
                console.warn('Geolocation access unavailable.');
            });
        }

        function placeUserMarker(lat, lng) {
            if (userMarker) {
                map.removeLayer(userMarker);
            }
            userMarker = L.circleMarker([lat, lng], {
                radius: 6,
                color: '#ffffff',
                fillColor: '#ff0000',
                fillOpacity: 1,
                weight: 2
            }).addTo(map).bindPopup("<b>Your Location</b>");
        }

        // Mobile Menu Toggle Logic & Screen Shift
        const menuToggleBtn = document.getElementById('mobile-menu-toggle');
        const controlsPanel = document.getElementById('controls');
        
        menuToggleBtn.addEventListener('click', () => {
            const isOpen = controlsPanel.classList.toggle('mobile-open');
            document.body.classList.toggle('menu-shifted', isOpen);
            menuToggleBtn.innerText = isOpen ? '✕' : '⚙️';
            setTimeout(() => { map.invalidateSize(); }, 300);
        });

        let notificationSettings = {
            enabled: false,
            categories: new Set(['stations']),
            allowDay: true,
            allowNight: true
        };

        const modal = document.getElementById('notif-modal');
        document.getElementById('open-notif-modal').addEventListener('click', () => {
            modal.style.display = 'flex';
        });
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        document.getElementById('save-modal-btn').addEventListener('click', () => {
            if (!userLat || !userLng) {
                alert('Acquiring your location coordinates... Please ensure location permissions are enabled.');
            }

            notificationSettings.categories.clear();
            if (document.getElementById('modal-cat-stations').checked) notificationSettings.categories.add('stations');
            if (document.getElementById('modal-cat-visual').checked) notificationSettings.categories.add('visual');
            if (document.getElementById('modal-cat-starlink').checked) notificationSettings.categories.add('starlink');
            if (document.getElementById('modal-cat-weather').checked) notificationSettings.categories.add('weather');
            if (document.getElementById('modal-cat-active').checked) notificationSettings.categories.add('active');

            notificationSettings.allowDay = document.getElementById('modal-time-day').checked;
            notificationSettings.allowNight = document.getElementById('modal-time-night').checked;
            notificationSettings.enabled = true;

            modal.style.display = 'none';
            statusDiv.innerText = `NOTIFICATIONS ACTIVE (${notificationSettings.categories.size} categories)`;
        });

        const WORKER_URL = 'https://satellite-proxy.aaaaadamobe19.workers.dev';

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        document.querySelectorAll('.cat-box').forEach(box => {
            box.addEventListener('change', async (e) => {
                const groupName = e.target.value;
                if (e.target.checked) {
                    await loadCategory(groupName);
                } else {
                    unloadCategory(groupName);
                }
                updateStatusText();
            });
        });

        document.getElementById('search-btn').addEventListener('click', executeSearch);
        document.getElementById('search-box').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });

        function executeSearch() {
            const query = document.getElementById('search-box').value.trim().toUpperCase();
            if (!query) return;

            let found = null;
            for (let tracker of allTrackers) {
                if (tracker.name.toUpperCase().includes(query) || tracker.noradId === query) {
                    found = tracker;
                    break;
                }
            }

            if (found) {
                selectedTracker = found;
                map.setView([found.lat, found.lng], Math.max(map.getZoom(), 4));
                showTrajectory(found);
                statusDiv.innerText = `FOUND: ${found.name}`;
            } else {
                statusDiv.innerText = `SATELLITE NOT FOUND`;
            }
        }

        async function loadCategory(groupName) {
            statusDiv.innerText = `FETCHING ${groupName.toUpperCase()}...`;
            try {
                const res = await fetch(`${WORKER_URL}?group=${groupName}`);
                if (!res.ok) throw new Error('Worker fetch failed');
                
                const text = await res.text();
                parseAndAddCategory(text, groupName);
            } catch (err) {
                console.warn(`Failed to fetch ${groupName}`, err);
                statusDiv.innerText = `ERROR LOADING ${groupName.toUpperCase()}`;
            }
        }

        function parseAndAddCategory(data, groupName) {
            const lines = data.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);

            for (let i = 0; i < lines.length - 2; i += 3) {
                const name = lines[i];
                const line1 = lines[i + 1];
                const line2 = lines[i + 2];

                if (!(line1 && line2 && line1.startsWith('1 ') && line2.startsWith('2 '))) continue;

                const noradId = line2.substring(2, 7).trim();

                if (nameToTracker.has(name)) {
                    nameToTracker.get(name).categories.add(groupName);
                    continue;
                }

                try {
                    const satrec = satellite.twoline2satrec(line1, line2);
                    
                    const marker = L.circleMarker([0, 0], {
                        radius: 2.5,
                        color: '#00ffff',
                        fillColor: '#ffffff',
                        fillOpacity: 0.8,
                        weight: 1,
                        renderer: canvasRenderer
                    });

                    const tracker = {
                        name: name,
                        noradId: noradId,
                        categories: new Set([groupName]),
                        satrec: satrec,
                        marker: marker,
                        isVisible: false,
                        lat: 0,
                        lng: 0,
                        notified: false
                    };

                    marker.on('click', (e) => {
                        selectSatellite(e, tracker);
                    });

                    allTrackers.push(tracker);
                    nameToTracker.set(name, tracker);
                } catch (e) {}
            }
            updateStatusText();
        }

        function unloadCategory(groupName) {
            for (let i = allTrackers.length - 1; i >= 0; i--) {
                const tracker = allTrackers[i];
                if (!tracker.categories.has(groupName)) continue;

                tracker.categories.delete(groupName);

                if (tracker.categories.size === 0) {
                    if (selectedTracker === tracker) {
                        clearTrajectory();
                    }
                    if (tracker.isVisible) {
                        map.removeLayer(tracker.marker);
                    }
                    allTrackers.splice(i, 1);
                    nameToTracker.delete(tracker.name);
                }
            }
            updateStatusText();
        }

        function updateStatusText() {
            if (allTrackers.length === 0) {
                statusDiv.innerText = "SELECT A CATEGORY...";
            } else {
                statusDiv.innerText = `TRACKING ${allTrackers.length} SATELLITES`;
            }
        }

        function selectSatellite(e, tracker) {
            L.DomEvent.stopPropagation(e);
            selectedTracker = tracker;
            showTrajectory(tracker);
        }

        function showTrajectory(tracker) {
            clearTrajectory();
            const nowMs = Date.now();
            const oneOrbitDuration = 93 * 60 * 1000;
            trajectoryEndTime = nowMs + oneOrbitDuration;
            const step = 60 * 1000;

            let currentSegment = [];
            const allSegments = [];

            for (let time = nowMs; time <= trajectoryEndTime; time += step) {
                const dateObj = new Date(time);
                const gmst = satellite.gstime(dateObj);
                const pv = satellite.propagate(tracker.satrec, dateObj);

                if (pv.position) {
                    const geo = satellite.eciToGeodetic(pv.position, gmst);
                    let lng = satellite.degreesLong(geo.longitude);
                    const lat = satellite.degreesLat(geo.latitude);

                    if (currentSegment.length > 0) {
                        const prevLng = currentSegment[currentSegment.length - 1][1];
                        if (Math.abs(lng - prevLng) > 180) {
                            allSegments.push(currentSegment);
                            currentSegment = [];
                        }
                    }
                    currentSegment.push([lat, lng]);
                }
            }
            if (currentSegment.length > 0) allSegments.push(currentSegment);

            allSegments.forEach(seg => {
                const polyline = L.polyline(seg, { color: '#ff00ff', weight: 2, opacity: 0.8 }).addTo(map);
                orbitLayers.push(polyline);
            });

            statusDiv.innerText = `SHOWING: ${tracker.name}`;
        }

        function clearTrajectory() {
            orbitLayers.forEach(layer => map.removeLayer(layer));
            orbitLayers = [];
            selectedTracker = null;
            updateStatusText();
        }

        function startMasterAnimationLoop() {
            let frameCount = 0;
            function loop() {
                frameCount++;
                if (frameCount % 3 === 0 && allTrackers.length > 0) {
                    const now = new Date();
                    const nowMs = now.getTime();
                    const gmst = satellite.gstime(now);
                    const currentZoom = map.getZoom();
                    const bounds = map.getBounds();

                    const currentHour = now.getUTCHours();
                    const isDayTime = currentHour >= 6 && currentHour < 18;

                    let skipFactor = 1;
                    if (currentZoom <= 2 && allTrackers.length > 2000) skipFactor = 4;
                    else if (currentZoom === 3 && allTrackers.length > 2000) skipFactor = 2;

                    for (let i = 0; i < allTrackers.length; i++) {
                        const tracker = allTrackers[i];
                        
                        if (i % skipFactor !== 0) {
                            if (tracker.isVisible) {
                                map.removeLayer(tracker.marker);
                                tracker.isVisible = false;
                            }
                            continue;
                        }

                        const pv = satellite.propagate(tracker.satrec, now);
                        if (pv.position) {
                            const geo = satellite.eciToGeodetic(pv.position, gmst);
                            const lat = satellite.degreesLat(geo.latitude);
                            const lng = satellite.degreesLong(geo.longitude);
                            
                            tracker.lat = lat;
                            tracker.lng = lng;
                            const latLng = [lat, lng];

                            if (notificationSettings.enabled && userLat !== null && userLng !== null) {
                                let matchCat = false;
                                for (let cat of tracker.categories) {
                                    if (notificationSettings.categories.has(cat)) {
                                        matchCat = true;
                                        break;
                                    }
                                }

                                const matchesTimeCondition = (isDayTime && notificationSettings.allowDay) || (!isDayTime && notificationSettings.allowNight);

                                if (matchCat && matchesTimeCondition) {
                                    const dist = getDistanceFromLatLonInKm(lat, lng, userLat, userLng);
                                    if (dist <= 100) {
                                        if (!tracker.notified) {
                                            tracker.notified = true;
                                            alert(`⚠️ PASS ALERT: ${tracker.name} is within ${Math.round(dist)}km!`);
                                        }
                                    } else if (dist > 150) {
                                        tracker.notified = false;
                                    }
                                }
                            }

                            const isInsideScreen = bounds.contains(latLng);

                            if (isInsideScreen || tracker === selectedTracker) {
                                tracker.marker.setLatLng(latLng);
                                if (!tracker.isVisible) {
                                    tracker.marker.addTo(map);
                                    tracker.isVisible = true;
                                }
                            } else {
                                if (tracker.isVisible) {
                                    map.removeLayer(tracker.marker);
                                    tracker.isVisible = false;
                                }
                            }
                        }
                    }

                    if (selectedTracker && nowMs >= trajectoryEndTime) {
                        showTrajectory(selectedTracker);
                    }
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        map.on('click', () => clearTrajectory());
        startMasterAnimationLoop();

        loadCategory('active');
    </script>
</body>
</html>
